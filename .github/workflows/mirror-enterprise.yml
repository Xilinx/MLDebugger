name: Mirror main to MLDebug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-mldebug-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [ vdi ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to enterprise
        env:
          ENTERPRISE_TOKEN: ${{ secrets.MLDEBUG_ENTERPRISE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_MERGE_AUTOEDIT: "no"
        run: |
          # Send the username and token together. Answering only the password
          # prompt can pair the token with the saved login name.
          cred='!f() { echo username=x-access-token; echo "password=$ENTERPRISE_TOKEN"; }; f'
          git -c credential.helper= -c "credential.helper=$cred" \
            clone https://gitenterprise.xilinx.com/XDP/MLDebug.git "$RUNNER_TEMP/MLDebug"
          cd "$RUNNER_TEMP/MLDebug"
          git pull --no-rebase https://github.com/Xilinx/MLDebugger.git main
          git -c credential.helper= -c "credential.helper=$cred" push origin main
