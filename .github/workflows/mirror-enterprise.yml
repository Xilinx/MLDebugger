name: Mirror main to MLDebug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-mldebug-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [ vdi ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Debug token
        env:
          ENTERPRISE_TOKEN: ${{ secrets.MLDEBUG_ENTERPRISE_TOKEN }}
        run: |
          echo "token length: ${#ENTERPRISE_TOKEN}"
          curl -s -o /dev/null -w "%{http_code}\n" \
            -H "Authorization: token ${ENTERPRISE_TOKEN}" \
            https://gitenterprise.xilinx.com/api/v3/user
          git config --show-origin --get-regexp 'http\.|url\.|credential' || true

      - name: Push main to enterprise
        env:
          ENTERPRISE_TOKEN: ${{ secrets.MLDEBUG_ENTERPRISE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_MERGE_AUTOEDIT: "no"
        run: |
          # x-access-token plus the PAT is a complete HTTPS credential, so git
          # does not ask for a username or password. Clearing credential.helper
          # keeps the runner's saved enterprise login out of this request.
          remote="https://x-access-token:${ENTERPRISE_TOKEN}@gitenterprise.xilinx.com/XDP/MLDebug.git"
          git -c credential.helper= clone "$remote" "$RUNNER_TEMP/MLDebug"
          cd "$RUNNER_TEMP/MLDebug"
          git remote set-url origin https://gitenterprise.xilinx.com/XDP/MLDebug.git
          git pull --no-rebase https://github.com/Xilinx/MLDebugger.git main
          git -c credential.helper= push "$remote" main
